[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlp"
version = "0.1.0"
description = "Biblioteca de Redes Neurais Artificiais Multicamadas (INE5664 - UFSC)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Equipe INE5664 - UFSC" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
notebook = [
    "matplotlib>=3.5.0",
    "pandas>=1.4.0",
    "scikit-learn>=1.0.0",
    "jupyter>=1.0.0",
    "notebook>=6.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mlp*"]
exclude = ["tests*", "scripts*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=mlp --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
pythonpath = ["."]
